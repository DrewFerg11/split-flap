; Split-flap module firmware (STM32G031, pcb/module-board) over ST-Link, SWD on J6 pads 2-5.
;   pio run -e node -t upload       module, same image on every board (the ESP places it at its address)
;   pio run -e bridge -t upload     spare board as ESP32 <-> RS-485 adapter (J6 pads 6/7)
; Host side: ../controller (ESP32). Protocol: ../shared/sfbus.h.
;
; nucleo_g031k8 is the same die as our STM32G031F8P6 (64 KB / 8 KB); pins are set by register.
; HAL_UART_MODULE_ONLY drops the core's Serial so src/usart.cpp owns the USART IRQ handlers.

[platformio]
default_envs = node, bridge   ; plain `pio run` builds the boards, not the tests

[stm32]
platform        = ststm32
board           = nucleo_g031k8
framework       = arduino
upload_protocol = stlink
debug_tool      = stlink
build_flags     = -DPIO_FRAMEWORK_ARDUINO_NO_USB -DHAL_UART_MODULE_ONLY -I../shared

[env:node]
extends     = stm32

[env:bridge]
extends     = stm32
build_flags = ${stm32.build_flags} -DSFBUS_BRIDGE

; Unit tests on the PC (and in CI): pio test -e native. Tests cover the hardware-free headers in
; ../shared/sfbus.h (protocol) and include/motion.h; src/ needs the STM32 core and isn't built here.
[env:native]
platform         = native
test_framework   = unity
build_flags      = -std=gnu++17 -Wall -Wextra -I../shared
build_src_filter = -<*>
