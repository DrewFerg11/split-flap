# Release manifest for fw/module/vX.Y.Z (placeholder: nothing released yet). See .github/RELEASING.md.
# A release also needs RELEASE-NOTES.md with the matching version.
name = "Split-flap module firmware"
component = "module"
asset_prefix = "split-flap-module-fw"

[build]
system = "platformio"
# "node" is the one image for every board (placed by the ESP over the ENUM chain).
envs = ["node", "bridge"]
artifacts = ["firmware.bin", "firmware.elf"]

[links]
"Module board" = "../../pcb/module-board/README.md"
