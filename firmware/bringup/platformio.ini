; Module board v0.1 bring-up (pcb/module-board): STM32G031 over ST-Link (SWD on J6 pads 2-5)
; Build + flash:  pio run -t upload
; Serial (optional, needs a 3.3 V USB-UART on J6 TX/RX pads 6/7, 115200): pio device monitor
;
; There is no generic G031F board in the registry; nucleo_g031k8 is the same die (64 KB / 8 KB).
; Pins are addressed by PinName (PA_x), so the K8 variant's pin map doesn't matter.

[platformio]
default_envs = bringup

[env:bringup]
platform      = ststm32
board         = nucleo_g031k8
framework     = arduino
upload_protocol = stlink
debug_tool      = stlink
monitor_speed = 115200
monitor_echo  = yes
monitor_filters = send_on_enter

; Leave PA13/PA14 (SWD) alone, no USB, no default Serial: we build our own on USART2.
build_flags   = -DPIO_FRAMEWORK_ARDUINO_NO_USB

; Motor auto-test, reports on the LED only (no UART needed). Run:  pio run -e autotest -t upload
[env:autotest]
extends = env:bringup
build_flags = ${env:bringup.build_flags} -DMOTOR_AUTOTEST
