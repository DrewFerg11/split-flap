; Split-flap controller: ESP32 bench console over RS-485 (lib/sfctl + src/console.cpp).
; Protocol: ../shared/sfbus.h. Envs: esp32dev (ESP32 DevKit V1), s3 (ESP32-S3), c3 (ESP32-C3 Super Mini).
;   pio run -e c3 -t upload          build + flash (pick your board's env)
;   pio device monitor -e c3         console, type ? for the command list
;   pio test -e native               unit tests on the PC (calibration maths, console parsing)
; The serial port is autodetected; add upload_port / monitor_port to an env to pin one.

[platformio]
default_envs = esp32dev

[esp32]
platform        = espressif32
framework       = arduino
monitor_speed   = 115200
monitor_echo    = yes
monitor_filters = send_on_enter
build_flags     = -DCORE_DEBUG_LEVEL=0 -I../shared

[env:esp32dev]
extends     = esp32
board       = esp32dev

; S3 / C3: bus on GPIO5 (RX), GPIO6 (TX), GPIO4 (DE+RE). Console on the chip's native USB port
; (Super Mini boards have only that one; on an S3 DevKitC-1 use the port marked USB, not UART).
[env:s3]
extends     = esp32
board       = esp32-s3-devkitc-1
build_flags = ${esp32.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3]
extends     = esp32
board       = esp32-c3-devkitm-1
build_flags = ${esp32.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Unit tests for the hardware-free parts: lib/sfctl_core (calibration maths) and include/console_parse.h.
; lib/sfctl and src/ need the ESP32 core and aren't built here.
[env:native]
platform         = native
test_framework   = unity
build_flags      = -std=gnu++17 -Wall -Wextra -I../shared
build_src_filter = -<*>
lib_ignore       = sfctl
