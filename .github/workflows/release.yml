# Publishes a GitHub release when a release tag is pushed. See .github/RELEASING.md.
#   pcb/<board>/vX.Y  hw/<part>/vX.Y   -> attaches the committed files (never built here)
#   fw/<target>/vX.Y.Z  app/<app>/vX.Y.Z -> builds the firmware from the tagged source, then attaches it
# The publish job runs in the `release` environment: it waits for the admin's approval.
name: Release

on:
  push:
    tags: ["pcb/*/v*", "hw/*/v*", "fw/*/v*", "app/*/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      dir: ${{ steps.check.outputs.dir }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      sha: ${{ steps.check.outputs.sha }}    # build + publish use exactly the commit that passed the gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # tags + origin/main for the gates and the change list
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: check
        run: python tools/release/release.py check "$GITHUB_REF_NAME" --github-output

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/**/platformio.ini', needs.check.outputs.dir)) }}
      - run: pip install platformio
      - run: python tools/release/release.py build "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: dist/build/
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release      # required reviewer: the repo admin
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - if: needs.check.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: dist/build/
      # package re-runs every gate, including "tag still points at this commit"
      - run: python tools/release/release.py package "$GITHUB_REF_NAME" --out dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/assets/* \
            --verify-tag --latest=false \
            --title "$(cat dist/title.txt)" --notes-file dist/notes.md \
            $([ "$PRERELEASE" = true ] && echo --prerelease)
